<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;
            width:300px;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            margin:10px;
            cursor:pointer;
        }

        h2{
            color:green;
        }

    </style>

</head>

<body>

<div class="box">

<h1>Calculator</h1>

<form method="POST">

<input
type="number"
name="num1"
placeholder="Enter First Number"
required>

<input
type="number"
name="num2"
placeholder="Enter Second Number"
required>

<br>

<button
type="submit"
name="operation"
value="add">
Add
</button>

<button
type="submit"
name="operation"
value="subtract">
Subtract
</button>

</form>

{% if result is not none %}

<h2>Result : {{ result }}</h2>

{% endif %}

</div>

</body>
</html>
